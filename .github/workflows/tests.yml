# Runs every test on GitHub's Linux machines on each push and pull request, including the spaCy
# grammar tests that Windows Smart App Control blocks on some laptops.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
